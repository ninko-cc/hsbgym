<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="./js/deltae76.js" defer></script>
    <script src="./js/hsv.js" defer></script>
    <script src="./js/sv-gradation.js" defer></script>
    <script src="./js/main.js" defer></script>
    <link rel="stylesheet" href="./css/style.css" />
    <title>HSB Gym</title>
  </head>
  <body>
    <h1>HSB Gym</h1>
    <p>Adjust the color picker to bring "Preview" close to "Target".</p>
    <div class="hbox">
      <figure>
        <figcaption>Target</figcaption>
        <canvas id="target" width="200" height="200"></canvas>
      </figure>
      <figure>
        <figcaption>Preview</figcaption>
        <canvas id="preview" width="200" height="200"></canvas>
      </figure>
    </div>
    <div class="hbox wrap">
      <table>
        <thead>
          <tr>
            <th></th>
            <th>Target</th>
            <th>Preview</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th>H</th>
            <td id="h-target"></td>
            <td id="h-preview"></td>
          </tr>
          <tr>
            <th>S</th>
            <td id="s-target"></td>
            <td id="s-preview"></td>
          </tr>
          <tr>
            <th>B</th>
            <td id="v-target"></td>
            <td id="v-preview"></td>
          </tr>
        </tbody>
      </table>
      <div>
        <div id="lamps">
          <span class="lamp">💡</span>
          <span class="lamp">💡</span>
          <span class="lamp">💡</span>
          <span class="lamp">💡</span>
          <span class="lamp">💡</span>
        </div>
        <div id="score"></div>
      </div>
    </div>
    <div class="hbox strech">
      <canvas id="sv-gradation" width="400" height="400"></canvas>
      <input id="h-slider" type="range" min="0" max="360" value="180" />
    </div>
    <button id="next-button">Next Color</button>
  </body>
</html>
